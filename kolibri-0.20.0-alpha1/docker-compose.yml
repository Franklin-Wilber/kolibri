services:
  kolibri:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
      args:
        KOLIBRI_VERSION: 0.20.0a1
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      KOLIBRI_HOME: /kolibri
      KOLIBRI_HTTP_PORT: 8080
      KOLIBRI_ZIP_CONTENT_PORT: 8081
      KOLIBRI_PLUGIN_ENABLE: kolibri_oidc_client_plugin
      CLIENT_ID: ${OIDC_CLIENT_ID:-kolibri.app}
      CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-kolibri.app}
    volumes:
      - ./kolibri-data:/kolibri
    restart: unless-stopped

  postgres:
    profiles:
      - postgres
    image: postgres:16
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ./kolibri-pg:/var/lib/postgresql/data
#    command: "postgres -c log_statement=all -c log_line_prefix='%t %d '"
volumes:
  kolibri-data:
  kolibri-pg:
